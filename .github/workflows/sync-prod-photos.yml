          python3 <<'PY'
          import hashlib, os, subprocess, sys, time
          manifest = open("/tmp/photos.sha256").read()
          deletes = open("/tmp/deletes.txt").read()
          ua = "GustosGuide-github-sync/1.0"
          failures = []
          for line in manifest.strip().splitlines():
              sha, path = line.split()
              url = "https://gustosguide.com/" + path[len("public/"):]
              os.makedirs(os.path.dirname(path), exist_ok=True)
              downloaded = False
              last = ""
              for attempt in range(5):
                  r = subprocess.run(
                      ["curl", "-sS", "-A", ua, "-o", path, "-w", "%{http_code}", "--fail-with-body", url],
                      capture_output=True, text=True,
                  )
                  last = f"{r.returncode} {r.stdout} {r.stderr[-200:]}"
                  if r.returncode == 0 and r.stdout.strip() == "200":
                      got = hashlib.sha256(open(path, "rb").read()).hexdigest()
                      if got == sha:
                          print("ok", path)
                          downloaded = True
                          break
                      failures.append(f"hash mismatch {path}: expected {sha} got {got}")
                      downloaded = False
                      break
                  time.sleep(1 + attempt)
              if not downloaded and not any(path in f for f in failures):
                  failures.append(f"download failed {path}: {last}")
          for path in deletes.strip().splitlines():
              if os.path.exists(path):
                  os.remove(path)
                  print("deleted", path)
              else:
                  print("already absent", path)
          if failures:
              print("FAILURES:")
              print("\n".join(failures))
              sys.exit(1)
          print("all photos verified")
          PY

