<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#EEE3D6;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#EEE3D6;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;">
            <tr>
              <td style="padding:0 0 16px;">
                <img src="https://gustosguide.com/logo-email.png" width="64" height="64" alt="" style="display:block;border:0;" />
              </td>
            </tr>
            <tr>
              <td style="padding:0 0 12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:28px;font-style:normal;font-weight:650;letter-spacing:-0.03em;line-height:1.1;color:#181818;">Gusto's Guide</td>
            </tr>
            <tr>
              <td style="padding:0 0 24px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:18px;line-height:1.4;color:#181818;">Tap the button to finish signing up. It works best in the browser where you asked for it.</td>
            </tr>
            <tr>
              <td>
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#FF5330;color:#181818;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:18px;line-height:1;text-decoration:none;padding:14px 22px;border-radius:999px;">Sign in</a>
              </td>
            </tr>
            <tr>
              <td style="padding:24px 0 6px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.4;color:#181818;">Or type this code on Gusto's Guide:</td>
            </tr>
            <tr>
              <td style="padding:0 0 8px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:32px;font-weight:700;letter-spacing:0.18em;color:#181818;">{{ .Token }}</td>
            </tr>
            <tr>
              <td style="padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:1.4;color:#555555;">The link and the code work once and expire soon. If you did not ask to sign in, ignore this email.</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
