<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Signing in · Gusto's Guide</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #eee3d6;
        color: #181818;
        font-family: Georgia, "Times New Roman", serif;
      }
      h1 {
        font-weight: 400;
        font-style: italic;
        font-size: 2.5rem;
        padding: 1.5rem;
      }
      body { grid-template-rows: auto auto; align-content: center; }
      .late { visibility: hidden; text-align: center; animation: late 0s 8s forwards; }
      @keyframes late { to { visibility: visible; } }
    </style>
  </head>
  <body>
    <h1>Signing you in…</h1>
    <p class="late">Taking too long? <a href="/">Try again</a></p>
    <script src="/auth-callback.js"></script>
  </body>
</html>
